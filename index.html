<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="From the Terrible Mind of Caio.">
  <title>Equipe Róka</title>
  <link rel="icon" href="equipe/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/title.png">
  <link rel="stylesheet" href="style.css">
  <script src="head-loop.js?v=2" defer></script>
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <section class="opening" id="opening" aria-label="Vídeo de abertura">
    <video id="intro" autoplay playsinline preload="auto" poster="assets/intro-poster.jpg" aria-label="Abertura de From the Terrible Mind of Caio">
      <source src="assets/intro.mp4" type="video/mp4">
    </video>
    <button type="button" id="start" class="start-button" hidden>Reproduzir abertura</button>
</section>

  <main class="site" id="site" hidden>
    <div class="scene">
      <h1 class="title" id="title">
        <img src="assets/title.png" width="505" height="198" alt="From the Terrible Mind of Caio" draggable="false">
      </h1>
      <div class="head-frame" id="head-frame">
        <video id="head" loop muted playsinline preload="auto" poster="assets/head-poster.png" aria-label="Animação da cabeça em rotação contínua">
          <source src="assets/head-loop-continuous.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </main>

  <noscript>
    <style>.opening{display:none}.site[hidden]{display:grid!important}</style>
  </noscript>
  <a class="skip-opening" id="skip-opening" href="equipe/index.html">Pular abertura</a>
</body>
</html>
